<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    LINEアプリ内のWebViewはこのHTMLを強くキャッシュし、更新しても古い画面が
    表示され続けることがある。GitHub Pagesは配信ヘッダーを変更できないため、
    metaタグで毎回読み直させる(下のJSのバージョンクエリと合わせた二重の対策)。
  -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>資産管理ポータル</title>
  <link rel="stylesheet" href="css/style.css?v=20260823b">
  <!-- LIFF SDK。画面のロジックは js/app.js 以下に分けている -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="app">
    <div class="standalone"><p>読み込み中...</p></div>
  </div>
  <!--
    末尾の ?v=... はLINEアプリ内WebViewの強いキャッシュを避けるためのバスティング用クエリ。
    js/app.js の読み込み元(index.html)と、app.js自身が行うcustomer.js等への
    相対importの両方に同じ値を付けないとキャッシュが効いてしまうので、更新のたびに
    この値と各jsファイル内のimport文の値を揃えて書き換えること。
  -->
  <script type="module" src="js/app.js?v=20260823b"></script>
</body>
</html>
